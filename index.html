<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Cards</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html" class="logotipo-canto-da-tela">
            <img id="logotipo-cabecario" src="assets/logotipo.png" alt="logotipo">
        </div>
        <nav>
            <a href="index.html">Início</a>
            <a href="#" class="login">Entrada</a>
            <a href="#" class="confg"><img src="assets/Ícone de engrenagem marfim minimalista.png" alt=""></a>
        </nav>

    </header>
    <section class="Inicio">

        <div class="conteudoInicio">
            <div class="grupoextra">
                <img id="titulo" src="assets/letreiro.png" alt="Nome do site">

                <button id="comece">
                    Olá! Clique aqui para começar
                </button>
            </div>
            <img id="icone" src="assets/desenho-logotipo.png" alt="Logotipo do site">
        </div>


        <div class="fundo-form" id="fundoForm">

            <div class="caixaForm">

                <button class="fechar-form" id="fecharForm" type="button" aria-label="Fechar">
                    &times;
                </button>

                <h1>Seja bem-vindo!</h1>

                <form id="formLogin">

                    <div class="input-box">
                        <input placeholder="Nome" type="text" required>
                    </div>

                    <div class="input-box">
                        <input placeholder="Idade" type="text" required>
                    </div>


                    <div class="remember-forgot">
                        <button type="submit">Entrar</button>
                    </div>

                </form>
            </div>
        </div>
        </div>
    </section>
</body>

</html>
